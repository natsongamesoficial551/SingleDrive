name: Manter API ativa

on:
  schedule:
    # Fora dos minutos redondos para reduzir disputa na fila do GitHub.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

# O ping não precisa ler o repositório nem acessar credenciais.
permissions: {}

concurrency:
  group: keep-api-warm
  cancel-in-progress: false

jobs:
  health:
    name: Verificar API do Render
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Acordar e verificar a API
        shell: bash
        run: |
          set -euo pipefail
          # Não consultar login, banco ou arquivos: /health só verifica o processo.
          response="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 100 \
            --retry 1 --retry-delay 5 --retry-max-time 210 \
            --header 'Accept: application/json' \
            https://singledrive.onrender.com/health)"
          printf '%s' "$response" | python3 -c 'import json,sys; result=json.load(sys.stdin); sys.exit(0 if result.get("status") == "ok" else 1)'
          printf 'API disponível.\n' >> "$GITHUB_STEP_SUMMARY"
