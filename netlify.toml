[build]
  base = "frontend"
  command = "node scripts/check-deploy-env.cjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "functions"

[[redirects]]
  from = "/api/*"
  to = "https://singledrive.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
